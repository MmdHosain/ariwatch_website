# Fly.io configuration for the ARIWATCH Next.js storefront.
# Deploy from repository root:
#   fly launch --config deploy/fly.frontend.toml --no-deploy
#   fly deploy --config deploy/fly.frontend.toml \
#     --build-arg NEXT_PUBLIC_API_URL=https://api.ariwatch.ir \
#     --build-arg NEXT_PUBLIC_SITE_URL=https://ariwatch.ir

app = "ariwatch-web"
primary_region = "fra"

[build]
  dockerfile = "../frontend/Dockerfile"
  context = "../frontend"

[env]
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  INTERNAL_API_URL = "http://ariwatch-api.internal:4000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
