# Production overlay for Docker Compose.
# Usage (with external reverse proxy / Nginx):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up --build -d
# Usage (with built-in automatic HTTPS Caddy proxy):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.proxy.yml up --build -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a production database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set a production database name}

  backend:
    restart: unless-stopped
    ports: !reset
      - "127.0.0.1:4000:4000"
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?Set a production database user}:${POSTGRES_PASSWORD:?Set a production database password}@db:5432/${POSTGRES_DB:?Set a production database name}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      ADMIN_MOBILES: ${ADMIN_MOBILES:?Set administrator mobile numbers}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the public HTTPS storefront origin}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set the public HTTPS API origin}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:?Set the live Zarinpal merchant UUID}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      OTP_PROVIDER_URL: ${OTP_PROVIDER_URL:?Set the HTTPS SMS bridge URL}
      OTP_PROVIDER_TOKEN: ${OTP_PROVIDER_TOKEN:?Set the SMS bridge credential}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEED_CATALOG: ${SEED_CATALOG:-false}

  frontend:
    restart: unless-stopped
    ports: !reset
      - "127.0.0.1:3000:3000"
    logging: *default-logging
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?Set the public HTTPS API origin}
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_ORIGIN:?Set the public HTTPS storefront origin}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?Set the public HTTPS API origin}
      NEXT_PUBLIC_SITE_URL: ${FRONTEND_ORIGIN:?Set the public HTTPS storefront origin}
      INTERNAL_API_URL: http://backend:4000
