# Render Blueprint for one-click full-stack deployment.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ariwatch-db
    plan: starter
    databaseName: ariwatch
    user: ariwatch

services:
  - type: web
    name: ariwatch-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /ready
    disk:
      name: catalog-media
      mountPath: /app/uploads/catalog
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_CATALOG
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ariwatch-db
          property: connectionString
      - key: MEDIA_DIRECTORY
        value: /app/uploads/catalog
      - key: ADMIN_MOBILES
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: ZARINPAL_SANDBOX
        value: "false"
      - key: ZARINPAL_MERCHANT_ID
        sync: false
      - key: OTP_PROVIDER_URL
        sync: false
      - key: OTP_PROVIDER_TOKEN
        sync: false

  - type: web
    name: ariwatch-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: ariwatch-api
          property: hostport
